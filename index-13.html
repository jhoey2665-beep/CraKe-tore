<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craque $tore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-elevated: #1a1a1a;
      --bg-card: #1e1e1e;
      --bg-hover: #2a2a2a;
      --text: #e8eaed;
      --text-secondary: #9aa0a6;
      --accent: #34a853;
      --accent-blue: #8ab4f8;
      --border: #3c4043;
      --star: #fbbc04;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo img {
      height: 42px;
      width: auto;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .search-wrapper {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 18px;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 1px var(--accent-blue);
    }

    .search-box svg {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      width: 100%;
      font-family: inherit;
    }

    .search-box input::placeholder { color: var(--text-secondary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .header-btn:hover { background: var(--bg-hover); }

    .tabs-bar {
      display: flex;
      gap: 0;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      overflow-x: auto;
    }

    .tab {
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      font-family: inherit;
      transition: color 0.2s;
    }

    .tab:hover { color: var(--text); }

    .tab.active { color: var(--accent); }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 3px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 16px;
      color: var(--text);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      border: 1px solid transparent;
    }

    .game-card:hover {
      transform: translateY(-3px);
      background: var(--bg-hover);
      border-color: var(--border);
    }

    .game-card-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: #2a2a2a;
      overflow: hidden;
    }

    .game-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-card-body { padding: 12px; }

    .game-card-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .game-card-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .game-card-rating {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .game-card-rating svg {
      width: 12px;
      height: 12px;
      fill: var(--star);
    }

    .single-game {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .single-game .game-card { width: 200px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-elevated);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      transform: scale(0.96) translateY(16px);
      transition: transform 0.25s;
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .modal-img {
      width: 88px;
      height: 88px;
      border-radius: 16px;
      object-fit: cover;
      flex-shrink: 0;
      background: #2a2a2a;
    }

    .modal-info { flex: 1; min-width: 0; }

    .modal-info h3 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .modal-info .meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .modal-info .rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .modal-info .rating svg {
      width: 14px;
      height: 14px;
      fill: var(--star);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }

    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .modal-body { padding: 20px; }

    .modal-body p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .unlock-section { text-align: center; }

    .unlock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      font-family: inherit;
    }

    .unlock-btn:hover { background: #2d8e47; }
    .unlock-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .timer {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .timer span {
      color: var(--accent);
      font-weight: 600;
    }

    .links-container {
      display: none;
      margin-top: 16px;
      text-align: left;
    }

    .links-container.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .links-container h4 {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .link-item span {
      font-size: 13px;
      font-weight: 500;
    }

    .link-item a {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 16px;
      transition: background 0.2s;
    }

    .link-item a:hover { background: #2d8e47; }

    .features {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 32px 24px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .feature-icon svg { width: 18px; height: 18px; }

    .feature-text h4 {
      font-size: 13px;
      font-weight: 500;
    }

    .feature-text p {
      font-size: 11px;
      color: var(--text-secondary);
    }

    @media (max-width: 700px) {
      header {
        padding: 10px 16px;
        flex-wrap: wrap;
      }
      .search-wrapper {
        order: 3;
        width: 100%;
        max-width: none;
        margin-top: 8px;
      }
      .logo img { height: 34px; }
      main { padding: 16px; }
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .tabs-bar { padding: 0 12px; }
      .features {
        gap: 20px;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

    ];


    /*
    ═══════════════════════════════════════════════════════════════════════════════
    NÃO MEXA DAQUI PARA BAIXO  (é a parte que faz o site funcionar)
    ═══════════════════════════════════════════════════════════════════════════════
    */

    let currentTab = 'jogos';
    let currentItem = null;
    let unlockTimer = null;

    const tabData = {
      jogos:  { list: jogos,  title: 'Jogos em destaque' },
      roblox: { list: roblox, title: 'Roblox' },
      addons: { list: addons, title: 'Add-ons' }
    };

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      document.getElementById('sectionTitle').textContent = tabData[tab].title;
      document.getElementById('searchInput').value = '';
      renderList(tabData[tab].list);
    }

    function renderList(list) {
      const grid = document.getElementById('gamesGrid');
      grid.className = list.length === 1 ? 'games-grid single-game' : 'games-grid';

      if (list.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-secondary);grid-column:1/-1;text-align:center;padding:40px;">Nenhum resultado encontrado.</p>';
        return;
      }

      grid.innerHTML = list.map(g => `
        <div class="game-card" onclick="openModal('${g.id}')">
          <div class="game-card-img-wrap">
            <img class="game-card-img" src="${g.img}" alt="${g.title}"
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%232a2a2a%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23666%22 font-size=%2214%22 text-anchor=%22middle%22 dy=%22.3em%22%3E${encodeURIComponent(g.title.substring(0,12))}%3C/text%3E%3C/svg%3E'">
          </div>
          <div class="game-card-body">
            <div class="game-card-title">${g.title}</div>
            <div class="game-card-meta">${g.meta}</div>
            <div class="game-card-rating">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              ${g.rating}
            </div>
          </div>
        </div>
      `).join('');
    }

    function findItem(id) {
      return [...jogos, ...roblox, ...addons].find(i => i.id === id);
    }

    function openModal(id) {
      currentItem = findItem(id);
      if (!currentItem) return;

      document.getElementById('modalImg').src = currentItem.img;
      document.getElementById('modalTitle').textContent = currentItem.title;
      document.getElementById('modalMeta').textContent = currentItem.meta;
      document.getElementById('modalRating').textContent = currentItem.rating;
      document.getElementById('modalDesc').textContent = currentItem.desc;

      const btn = document.getElementById('unlockBtn');
      btn.style.display = 'inline-flex';
      btn.disabled = false;
      btn.textContent = 'Liberar Links de Download';
      document.getElementById('timer').style.display = 'none';
      document.getElementById('linksContainer').classList.remove('show');
      document.getElementById('linksContainer').innerHTML = '<h4>✅ Links liberados!</h4>';
      clearInterval(unlockTimer);

      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay') && e.type === 'click') return;
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
      clearInterval(unlockTimer);
    }

    function unlockLinks() {
      if (!currentItem) return;

      const btn = document.getElementById('unlockBtn');
      const timerEl = document.getElementById('timer');
      const countdownEl = document.getElementById('countdown');
      const container = document.getElementById('linksContainer');

      btn.disabled = true;
      btn.textContent = 'Liberando...';
      timerEl.style.display = 'block';

      let seconds = 5;
      countdownEl.textContent = seconds;

      unlockTimer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(unlockTimer);
          timerEl.style.display = 'none';
          btn.style.display = 'none';

          let html = '<h4>✅ Links liberados!</h4>';
          currentItem.links.forEach(link => {
            html += `
              <div class="link-item">
                <span>📦 ${link.label}</span>
                <a href="${link.url}" target="_blank" rel="noopener">Baixar</a>
              </div>
            `;
          });
          container.innerHTML = html;
          container.classList.add('show');
        }
      }, 1000);
    }

    function filterCurrentTab() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const list = tabData[currentTab].list;
      if (!q) {
        renderList(list);
        return;
      }
      const filtered = list.filter(g =>
        g.title.toLowerCase().includes(q) || g.meta.toLowerCase().includes(q)
      );
      renderList(filtered);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    renderList(jogos);
  </script>
</body>
